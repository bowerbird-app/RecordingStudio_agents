AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  Exclude:
    - "test/dummy/**/*"
    - "vendor/**/*"
    - "bin/**/*"

Style/Documentation:
  Enabled: false

Style/StringLiterals:
  Enabled: true
  EnforcedStyle: double_quotes

Layout/LineLength:
  Max: 120
  Exclude:
    - "lib/generators/**/*"
    - "lib/recording_studio_agents/admin/**/*"
    - "db/migrate/**/*"

Metrics/ClassLength:
  Exclude:
    - "test/**/*"
    - "lib/recording_studio_agents/persistence.rb"
    - "lib/recording_studio_agents/execution.rb"
    - "lib/recording_studio_agents/admin/**/*"

Metrics/ModuleLength:
  Exclude:
    - "lib/recording_studio_agents/admin/**/*"

Metrics/MethodLength:
  Exclude:
    - "test/**/*"
    - "lib/generators/**/*"
    - "lib/recording_studio_agents/persistence.rb"
    - "lib/recording_studio_agents/execution.rb"
    - "lib/recording_studio_agents/programs.rb"
    - "lib/recording_studio_agents/handoffs.rb"
    - "lib/recording_studio_agents/agents.rb"
    - "lib/recording_studio_agents/agent.rb"
    - "lib/recording_studio_agents/ai.rb"
    - "lib/recording_studio_agents/skills.rb"
    - "lib/recording_studio_agents/admin/**/*"
    - "app/models/recording_studio_agents/**/*"
    - "db/migrate/**/*"

Metrics/AbcSize:
  Exclude:
    - "test/**/*"
    - "lib/generators/**/*"
    - "lib/recording_studio_agents/persistence.rb"
    - "lib/recording_studio_agents/execution.rb"
    - "lib/recording_studio_agents/programs.rb"
    - "lib/recording_studio_agents/handoffs.rb"
    - "lib/recording_studio_agents/ai.rb"
    - "lib/recording_studio_agents/admin/**/*"
    - "db/migrate/**/*"

Metrics/BlockLength:
  Exclude:
    - "test/**/*"
    - "lib/recording_studio_agents/admin/**/*"
    - "lib/recording_studio_agents/engine.rb"
    - "db/migrate/**/*"

Metrics/CyclomaticComplexity:
  Exclude:
    - "test/**/*"
    - "lib/recording_studio_agents/persistence.rb"
    - "lib/recording_studio_agents/execution.rb"
    - "lib/recording_studio_agents/programs.rb"

Metrics/PerceivedComplexity:
  Exclude:
    - "lib/recording_studio_agents/persistence.rb"
    - "lib/recording_studio_agents/execution.rb"
    - "lib/recording_studio_agents/programs.rb"

Metrics/ParameterLists:
  Exclude:
    - "lib/recording_studio_agents/persistence.rb"
    - "lib/recording_studio_agents/programs.rb"
    - "lib/recording_studio_agents/skills.rb"
    - "lib/recording_studio_agents/agents.rb"
    - "lib/recording_studio_agents/knowledge.rb"
    - "lib/recording_studio_agents/agent.rb"
    - "lib/recording_studio_agents/execution.rb"
    - "app/models/recording_studio_agents/**/*"

Lint/EmptyBlock:
  Exclude:
    - "test/**/*"

Lint/NestedMethodDefinition:
  Exclude:
    - "test/**/*"

Naming/VariableNumber:
  Exclude:
    - "test/**/*"

Lint/MissingSuper:
  Exclude:
    - "test/services/**/*"
